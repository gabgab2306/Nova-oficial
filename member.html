<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA · Área de Integrantes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="css/member.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="ambient a"></div><div class="ambient b"></div><div id="auth" class="auth-shell"><div class="brand">NOVA <span>INTEGRANTES</span></div><section class="auth-card"><span class="eyebrow">ÁREA DE INTEGRANTES</span><h1>Tu espacio en NOVA.</h1><p>Accede con el correo con el que fuiste aprobado como integrante.</p><form id="loginForm"><label>Correo<input id="email" type="email" autocomplete="email" required placeholder="tu correo"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="primary">Entrar <b>↗</b></button><p id="authMsg" class="msg"></p></form><div class="activation"><b>¿Es tu primer acceso?</b><p>Activa tu cuenta usando el mismo correo registrado en NOVA.</p><form id="activateForm"><input id="activateEmail" type="email" required placeholder="correo registrado"><input id="activatePassword" type="password" minlength="6" required placeholder="Crea una contraseña"><button class="secondary">Activar cuenta</button><p id="activateMsg" class="msg"></p></form></div></section></div><div id="app" class="app hidden"><aside class="sidebar"><div class="brand">NOVA<span>INTEGRANTES</span></div><nav><button data-view="inicio" class="active">⌂ <span>Inicio</span></button><button data-view="actividades">◫ <span>Actividades</span></button><button data-view="debates">◇ <span>Debates</span></button><button data-view="calificaciones">◈ <span>Calificaciones</span></button><button data-view="feedback">✦ <span>Feedback</span></button></nav><button id="logout" class="logout">Salir ↗</button></aside><main class="content"><header><
